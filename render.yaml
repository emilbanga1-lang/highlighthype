# Render blueprint — deploys HighlightHype as a single web service.
# The live service runs on the Starter plan with the 1 GB persistent
# disk below mounted at /var/data (uploads, votes and the SQLite DB
# live there). Keep this plan in sync with the dashboard service:
# a free-tier redeploy has an ephemeral filesystem and would lose data.
services:
  - type: web
    name: highlighthype
    env: node
    plan: starter
    buildCommand: "npm install --omit=dev || true"
    startCommand: "node server.js"
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: highlighthype-data
      mountPath: /var/data
      sizeGB: 1
