<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hype Battles — HighlightHype preview</title>
<style>
  :root{ --bg:#0a0a0a; --panel:#131313; --line:#2a2a2a; --gold:#f0b93e; --gold2:#c9932b; --ink:#f5f1e6; --mut:#a49e8f; }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{background:radial-gradient(120% 60% at 50% 0%, #1a160d 0%, var(--bg) 55%); color:var(--ink); font-family:"Helvetica Neue", Arial, sans-serif; min-height:100vh;}
  .wrap{max-width:430px; margin:0 auto; padding:18px 14px 26px;}
  .tag{color:var(--gold); font-weight:800; letter-spacing:.22em; font-size:10px; text-transform:uppercase; text-align:center;}
  h1{font-size:34px; font-weight:900; font-style:italic; text-align:center; margin-top:4px;}
  h1 .gold{color:var(--gold);}
  .modes{display:flex; background:#1b1b1b; border:1px solid var(--line); border-radius:999px; padding:4px; margin:14px auto 0; max-width:320px;}
  .modes button{flex:1; border:0; background:transparent; color:var(--mut); font-weight:800; font-size:13px; padding:8px 0; border-radius:999px; cursor:pointer;}
  .modes button.on{background:var(--gold); color:#1a1204;}
  .pool{margin:12px auto 0; max-width:340px; text-align:center; font-size:11.5px; line-height:1.45; color:#e8cf8f; background:rgba(240,185,62,.09); border:1px solid rgba(240,185,62,.45); border-radius:10px; padding:7px 10px;}
  .prompt{text-align:center; font-size:19px; font-weight:800; margin-top:16px;}
  .promptSub{text-align:center; color:var(--mut); font-size:13px; margin-top:3px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-top:14px; transition:box-shadow .25s, border-color .25s, transform .25s;}
  .card.winner{border:2px solid var(--gold); box-shadow:0 0 0 5px rgba(240,185,62,.15), 0 14px 40px rgba(0,0,0,.5); transform:scale(1.015);}
  .media{position:relative; cursor:pointer;}
  .media video{display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#000;}
  .playdisc{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;}
  .playdisc span{width:54px; height:54px; border-radius:50%; background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.85); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; padding-left:4px;}
  .card.playing .playdisc{display:none;}
  .stamp{position:absolute; top:10px; right:10px; background:var(--gold); color:#191204; font-weight:900; font-size:12px; letter-spacing:.1em; padding:6px 10px; border-radius:999px; transform:rotate(4deg) scale(0); transition:transform .3s cubic-bezier(.2,1.6,.4,1);}
  .card.winner .stamp{transform:rotate(4deg) scale(1);}
  .streak{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.7); color:var(--gold); font-weight:800; font-size:12px; padding:5px 9px; border-radius:999px; display:none;}
  .card.champ .streak{display:block;}
  .cbody{padding:12px 14px 14px;}
  .title{font-size:18px; font-weight:800;}
  .meta{color:var(--mut); font-size:12.5px; margin-top:2px;}
  .pick{width:100%; margin-top:11px; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:900; cursor:pointer; background:linear-gradient(180deg, var(--gold), var(--gold2)); color:#1a1204;}
  .pick:disabled{opacity:.45;}
  .vs{display:flex; align-items:center; justify-content:center; margin:10px 0 -4px;}
  .vs span{width:44px; height:44px; border-radius:50%; background:#000; border:2px solid var(--gold); color:var(--gold); font-weight:900; font-style:italic; font-size:15px; display:flex; align-items:center; justify-content:center;}
  .controls{display:flex; gap:10px; margin-top:18px; align-items:center;}
  .skip{flex:0 0 auto; background:transparent; border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:13px 14px; font-size:14px; font-weight:700; cursor:pointer;}
  .next{flex:1; border:0; border-radius:12px; padding:14px; font-size:16px; font-weight:900; cursor:pointer; background:#f5f1e6; color:#111; display:none;}
  .next.show{display:block;}
  .count{text-align:center; color:var(--mut); font-size:13px; margin-top:14px;}
</style></head>
<body>
  <div class="wrap">
    <p class="tag">Preview · Test page</p>
    <h1>HYPE <span class="gold">BATTLES</span></h1>

    <div class="modes" role="tablist">
      <button id="modeFresh" class="on" onclick="setMode('fresh')">Fresh pairs</button>
      <button id="modeStay" onclick="setMode('stay')">Winner stays</button>
    </div>

    <p class="pool"><strong>SAMPLE POOL</strong> — demo plays only. Battle picks join Hype of the Month once real entries have enough same-sport matchups.</p>

    <p class="prompt">Which play made you hit replay?</p>
    <p class="promptSub">Tap a clip to watch it. Then pick the play.</p>

    <div id="slotA"></div>
    <div class="vs"><span>VS</span></div>
    <div id="slotB"></div>

    <div class="controls">
      <button class="skip" id="skipBtn" onclick="skipBattle()">Skip matchup</button>
      <button class="next" id="nextBtn" onclick="nextBattle()">Next battle →</button>
    </div>
    <p class="count" id="countLine">Battle 1</p>
    <p class="count" style="margin-top:18px"><a href="/" style="color:var(--mut)">← Back to HighlightHype</a></p>
  </div>

<script>
  const CLIPS = {
    bb1: { src: 'battles/bb1.mp4', poster: 'battles/bb1.jpg', title: 'Winning Hit', meta: 'Baseball · Boys', sport: 'baseball' },
    bb2: { src: 'battles/bb2.mp4', poster: 'battles/bb2.jpg', title: 'Line Drive Down the Line', meta: 'Baseball · Boys', sport: 'baseball' },
    sb1: { src: 'battles/sb1.mp4', poster: 'battles/sb1.jpg', title: 'Big Hit to the Gap', meta: 'Softball · Girls', sport: 'softball' },
    sb2: { src: 'battles/sb2.mp4', poster: 'battles/sb2.jpg', title: 'Shot to the Fence', meta: 'Softball · Girls', sport: 'softball' }
  };
  const PAIRS = [ ['bb1','bb2'], ['sb1','sb2'] ];
  let mode = 'fresh';
  let battle = 0;          // battle counter
  let pairIdx = 0;         // which pool pair
  let flip = false;        // rotate which clip appears first
  let cur = { A: null, B: null };
  let champ = null, streak = 0;
  let picked = false;

  function cardHTML(slot, key, isChamp) {
    const c = CLIPS[key];
    return `<article class="card${isChamp ? ' champ' : ''}" id="card${slot}">
      <div class="media" onclick="togglePlay('${slot}')">
        <video id="vid${slot}" src="${c.src}" poster="${c.poster}" playsinline loop preload="metadata"></video>
        <div class="playdisc"><span>▶</span></div>
        ${isChamp ? `<span class="streak">👑 Won ${streak} in a row</span>` : ''}
        <span class="stamp">👑 WINNER</span>
      </div>
      <div class="cbody">
        <p class="title">${c.title}</p>
        <p class="meta">${c.meta}</p>
        <button class="pick" id="pick${slot}" onclick="pick('${slot}')">Pick this play</button>
      </div>
    </article>`;
  }

  function render() {
    picked = false;
    const champKey = (mode === 'stay') ? champ : null;
    document.getElementById('slotA').innerHTML = cardHTML('A', cur.A, champKey === cur.A);
    document.getElementById('slotB').innerHTML = cardHTML('B', cur.B, champKey === cur.B);
    document.getElementById('nextBtn').classList.remove('show');
    document.getElementById('skipBtn').style.display = '';
    document.getElementById('countLine').textContent =
      'Battle ' + (battle + 1) + (mode === 'stay' && champ ? ' · Champion: ' + CLIPS[champ].title : '');
  }

  function dealFresh() {
    const pair = PAIRS[pairIdx % PAIRS.length];
    const order = flip ? [pair[1], pair[0]] : [pair[0], pair[1]];
    cur = { A: order[0], B: order[1] };
  }

  function nextBattle() {
    battle++;
    if (mode === 'fresh') { pairIdx++; flip = !flip; dealFresh(); }
    else {
      // winner stays: challenger = next clip that isn't the champion, preferring same sport
      const others = Object.keys(CLIPS).filter(k => k !== champ);
      const sameSport = others.filter(k => CLIPS[k].sport === CLIPS[champ].sport);
      const pool = sameSport.length ? sameSport : others;
      const challenger = pool[battle % pool.length];
      const loserSlot = cur.A === champ ? 'B' : 'A';
      cur[loserSlot] = challenger;
    }
    render();
  }

  function skipBattle() { nextBattle(); }

  function pick(slot) {
    if (picked) return;
    picked = true;
    const winnerKey = cur[slot];
    const loserSlot = slot === 'A' ? 'B' : 'A';
    pauseAll();
    document.getElementById('card' + slot).classList.add('winner');
    document.getElementById('pickA').disabled = true;
    document.getElementById('pickB').disabled = true;
    document.getElementById('pick' + loserSlot).textContent = 'Not this time';
    document.getElementById('skipBtn').style.display = 'none';
    document.getElementById('nextBtn').classList.add('show');
    if (mode === 'stay') {
      if (champ === winnerKey) streak++; else { champ = winnerKey; streak = 1; }
    }
  }

  function pauseAll() {
    ['A','B'].forEach(s => {
      const v = document.getElementById('vid' + s);
      if (v) { v.pause(); document.getElementById('card' + s).classList.remove('playing'); }
    });
  }

  function togglePlay(slot) {
    const v = document.getElementById('vid' + slot);
    const card = document.getElementById('card' + slot);
    if (!v.paused) { v.pause(); card.classList.remove('playing'); return; }
    pauseAll();
    v.play(); card.classList.add('playing');
  }

  function setMode(m) {
    mode = m; battle = 0; pairIdx = 0; flip = false; champ = null; streak = 0;
    document.getElementById('modeFresh').classList.toggle('on', m === 'fresh');
    document.getElementById('modeStay').classList.toggle('on', m === 'stay');
    dealFresh(); render();
  }

  dealFresh(); render();
</script>
</body></html>
